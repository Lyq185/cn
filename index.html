    border-color: rgba(214,166,103,0.48) !important;
    color: rgba(247,211,138,0.58) !important;

<body data-theme="glass" class="leather-texture-loaded card-texture-loaded dark-leather-texture-loaded dark-card-texture-loaded">
<script>try{document.body.setAttribute("data-theme","glass");localStorage.setItem("penSleeveFitThemeLeatherV1","glass")}catch(e){document.body.setAttribute("data-theme","glass")}</script>
<div class="app">
  <header class="topbar" aria-label="App header">
    <h1><span class="title-desktop">✒️ 笔套适配系统 V5.0</span><span class="title-mobile">笔套适配系统 V5.0</span></h1>
    <nav class="theme-switch" aria-label="Theme switcher">
      <button id="themeDarkBtn" class="theme-option" type="button" aria-pressed="false">Dark</button>
      <button id="themeGlassBtn" class="theme-option" type="button" aria-pressed="true">Green</button>
    </nav>
  </header>
  <div class="card">
    <div class="first-row">
      <div class="capsule-stepper" id="qtyStepper" style="margin:0;">
        <button onclick="setLimit(-1)">–</button>
        <span class="value" id="limitVal">0</span>
        <button onclick="setLimit(1)">+</button>
      </div>
      <div class="stitch-group">
        <button class="stitch-btn disabled" id="crossBtn" onclick="selectStitch('cross')">交叉缝</button>
        <button class="stitch-btn disabled" id="saddleBtn" onclick="selectStitch('saddle')">马鞍缝</button>
      </div>
    </div>
  </div>
  <div class="card">
    <input type="range" id="D" min="7" max="18.5" step="0.1" value="7">
    <div style="margin-top:12px;">
      <div class="stepper-row">
        <div class="switch" style="margin:0;gap:12px;">
          <button id="c1" onclick="mode('clipless')">N</button>
          <button id="c2" onclick="mode('clipped')">S</button>
          <button id="c3" onclick="mode('w_clip')">W</button>
        </div>
        <div class="capsule-stepper" style="margin:0;">
          <button id="diaMinusBtn" onclick="diaStep(-0.1)">–</button>
          <span class="value" id="Dv">7.0</span>
          <button id="diaPlusBtn" onclick="diaStep(0.1)">+</button>
        </div>
      </div>
    </div>
    <div class="tag" id="Dc" style="margin-top:12px;text-align:center;"></div>
  </div>
  <div class="card">
    <input type="range" min="85" max="165" step="1" value="85" id="L">
    <div class="stepper-row" style="margin-top:12px;">
      <div class="stepper-label">📏 长度</div>
      <div class="capsule-stepper" style="margin:0;">
        <button onclick="lenStep(-0.1)">–</button>
        <span class="value" id="Lv">85.0</span>
        <button onclick="lenStep(0.1)">+</button>
      </div>
    </div>
    <div class="tag" id="Lc" style="margin-top:12px;text-align:center;"></div>
  </div>
  <div class="card" id="colorCard">
    <div class="color-module-row">
      <div class="color-label" id="colorLabel">
        <span class="color-label-icon">🎨</span>
        <span class="color-label-text" id="leatherLabelText">皮革</span>
      </div>
      <div class="color-chips-group" id="colorChipsGroup">
        <div class="color-chip" data-color="Caramel" style="background-color: #c68a4c;">
          <img src="images/Caramel.png" alt="Caramel" onerror="this.onerror=null; this.style.display='none'; this.parentElement.classList.add('no-image');">
          <span class="custom-tooltip" style="color: #c68a4c;">焦糖色</span>
        </div>
        <div class="color-chip" data-color="Yellow" style="background-color: #facc15;">
          <img src="images/Yellow.png" alt="Yellow" onerror="this.onerror=null; this.style.display='none'; this.parentElement.classList.add('no-image');">
          <span class="custom-tooltip" style="color: #facc15;">黄色</span>
        </div>
        <div class="color-chip" data-color="Nero" style="background-color: #4a4a4a;">
          <img src="images/Nero.png" alt="Nero" onerror="this.onerror=null; this.style.display='none'; this.parentElement.classList.add('no-image');">
          <span class="custom-tooltip" style="color: #4a4a4a;">乌木黑</span>
        </div>
        <div class="color-chip" data-color="Red" style="background-color: #e34234;">
          <img src="images/Red.png" alt="Red" onerror="this.onerror=null; this.style.display='none'; this.parentElement.classList.add('no-image');">
          <span class="custom-tooltip" style="color: #e34234;">红色</span>
        </div>
      </div>
    </div>
  </div>
  <div class="card" id="previewCard">
    <div class="stepper-row">
      <div class="stepper-label">
        <label style="font-size:20px;">✨ 适配预览</label>
        <div class="big" id="previewCount" style="font-size:22px; display:inline-block; margin-left:6px;"></div>
      </div>
      <div class="capsule-stepper" style="margin:0;">
        <button id="qtyMinusBtn" class="qty-control-btn" onclick="handleQtyChange(-1)">–</button>
        <span class="value" id="q">0</span>
        <button id="qtyPlusBtn" class="qty-control-btn" onclick="handleQtyChange(1)">+</button>
      </div>
    </div>
    <div id="preview" style="font-size:26px; word-break:break-word;"></div>
  </div>
  <div id="historyPanel">
    <div id="history"></div>
  </div>
  <div class="bottom">
    <div class="bottom-container">
      <div class="bottom-buttons">
        <button id="genBtn" onclick="showConfirm()">保存</button>
        <button id="copyBtn" onclick="copy()" disabled>复制</button>
        <button id="clearBtn" onclick="showClearConfirm()">清空</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div id="confirmPanel">
    <div id="confirmBox">
      <div id="confirmText"></div>
      <div id="confirmHint">请确认</div>
      <div class="confirm-btns">
        <button id="confirmCancel" onclick="hideConfirm()">取消</button>
        <button id="confirmSave" onclick="doSave()">保存</button>
      </div>
    </div>
  </div>
  <div id="clearConfirmPanel">
    <div id="clearConfirmBox">
      <div id="clearConfirmText">清除所有数据吗？</div>
      <div class="clear-confirm-btns">
        <button id="clearConfirmCancel" onclick="hideClearConfirm()">取消</button>
        <button id="clearConfirmOK" onclick="doClear()">OK</button>
      </div>
    </div>
  </div>
  <div id="deleteConfirmPanel">
    <div id="deleteConfirmBox">
      <div id="deleteConfirmText">删除此配置吗？</div>
      <div class="delete-confirm-btns">
        <button id="deleteConfirmCancel" onclick="hideDeleteConfirm()">取消</button>
        <button id="deleteConfirmOK" onclick="doDelete()">删除</button>
      </div>
    </div>
  </div>
