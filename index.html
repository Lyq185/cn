</div>
</div>

<div class="card">

<div style="margin-top:12px;">
<div class="stepper-row">
<div class="switch" style="margin:0;gap:12px;">
<button id="c1" onclick="mode('clipless')">N</button>
<button id="c2" onclick="mode('clipped')">S</button>
<button id="c3" onclick="mode('w_clip')">W</button>
</div>
<div class="capsule-stepper" style="margin:0;">
<button id="diaMinusBtn" onclick="diaStep(-0.1)">–</button>

</div>
</div>
</div>
<div class="tag" id="Dc" style="margin-top:12px;text-align:center;"></div>
</div>
<div class="card">
<input type="range" min="85" max="165" step="1" value="85" id="L">
<div class="stepper-row" style="margin-top:12px;">
<div class="stepper-label">📏 长度</div>
<div class="capsule-stepper" style="margin:0;">

<span class="value" id="Lv">85.0</span>
<button onclick="lenStep(0.1)">+</button>
</div>
</div>
<div class="tag" id="Lc" style="margin-top:12px;text-align:center;"></div>
</div>

  pointer-events: none;
  transform: translateX(-50%);

html body .guide-hint.show {
  visibility: visible;
  animation: psfGuideHintBlink 1.2s ease-in-out 3;
}
@keyframes psfGuideHintBlink {
  0%,100% { opacity: 1; }
  50% { opacity: .26; }
}
@media (max-width: 380px) {
  html body .guide-toggle {
    height: 28px;
    min-height: 28px;
    padding: 0 9px;
    font-size: 13px;
  }
  html body .guide-pagination {

    gap: 4px;
  }
  html body .guide-page-numbers {
    gap: 2px;
  }
  html body .guide-arrow,
  html body .guide-page-button {
    height: 28px;
    font-size: 13px;
  }
  html body .guide-arrow {
    width: 28px;
    font-size: 21px;
  }
}

/* Guide refinement: separate page controls, exact-fit image card, fine texture. */
html body #guidePaginationCard#guidePaginationCard {
  display: none;
  width: 100%;
  height: auto;
  box-sizing: border-box !important;
  border: 1.5px solid rgba(214,166,103,.95) !important;
  border-radius: 18px !important;
}
html body.guide-open #guidePaginationCard#guidePaginationCard {
  display: block !important;
}
html body #guidePaginationCard .guide-pagination {
  margin: 0 !important;
}
html body #guideCard#guideCard {
  padding: 0 !important;
  min-height: 0 !important;
  line-height: 0 !important;
  overflow: hidden !important;
}
html body #guideCard .guide-stage {
  min-height: 0 !important;
  line-height: 0 !important;
}
html body #guideCard #guideImage {
  display: none;
  width: 100% !important;
  max-width: 100% !important;
  height: auto !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  vertical-align: top !important;
}
html body #guideCard #guideImage.ready {
  display: block !important;
}
html body #guideCard .guide-status[hidden] {
  display: none !important;
}
html body[data-theme="green"].card-texture-loaded #guidePaginationCard#guidePaginationCard,
html body[data-theme="green"].card-texture-loaded #guideCard#guideCard {
  background-repeat: no-repeat,repeat !important;
  background-position: center,center !important;
  background-size: auto,336px 336px !important;
}
html body[data-theme="dark"].dark-card-texture-loaded #guidePaginationCard#guidePaginationCard,
html body[data-theme="dark"].dark-card-texture-loaded #guideCard#guideCard {
  background-repeat: no-repeat,no-repeat,repeat !important;
  background-position: center,center,center !important;
  background-size: auto,auto,336px 336px !important;
}
html body h1 #guideHint#guideHint {
  display: none !important;
  position: static !important;
  inset: auto !important;
  z-index: auto !important;
  width: auto !important;
  inline-size: auto !important;
  min-width: 0 !important;
  max-width: none !important;
  height: auto !important;
  padding: 0 !important;
  margin: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  color: inherit !important;
  -webkit-text-fill-color: currentColor !important;
  font-size: clamp(10px,3vw,14px) !important;
  font-weight: 700 !important;
  line-height: 1.2 !important;
  letter-spacing: -.1px !important;
  white-space: nowrap !important;
  text-align: left !important;
  text-shadow: inherit !important;
  opacity: 0;
  visibility: hidden;
  pointer-events: none !important;
  transform: none !important;
  isolation: auto !important;
}
html body h1.psf-guide-title-hint .title-desktop,
html body h1.psf-guide-title-hint .title-mobile {
  display: none !important;
}
html body .topbar h1.psf-guide-title-hint {
  margin-right: -4px !important;
  overflow: hidden !important;
  text-align: right !important;
}
html body h1.psf-guide-title-hint #guideHint#guideHint.show {
  display: inline-block !important;
  visibility: visible !important;
  max-width: 100% !important;
  vertical-align: middle !important;
  text-align: right !important;
  animation: psfGuideHintBlink 1.2s ease-in-out 3 !important;
}
html body h1.psf-guide-title-hint #guideHint#guideHint.show.psf-guide-hint-fade-out {

@keyframes psfGuideHintFadeOut {

html body h1.psf-guide-title-fade .title-desktop,

@keyframes psfGuideTitleFadeIn {

@media (min-width: 481px) {
